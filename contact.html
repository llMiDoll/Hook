<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Hook</title>
<link rel="stylesheet" href="style.css"></head><body>
<main>
<section class="phero"><div class="wrap"><span class="script" data-ar="قول أهلاً">Say hello</span><h1 data-ar="تواصل معنا">Contact</h1>
<p data-ar="احكيلنا عن البراند بتاعك. بنرد على واتساب أو الإيميل.">Tell us about your brand. We reply on WhatsApp or email.</p></div></section>
<section style="padding-top:20px"><div class="wrap split">
<form id="f" class="card">
<label><span data-ar="الاسم">Name</span><input name="n" required></label>
<label><span data-ar="البراند أو الشركة">Brand or company</span><input name="b"></label>
<label><span data-ar="محتاج إيه؟">What do you need?</span><select name="s"><option data-ar="سوشيال ميديا">Social media</option><option data-ar="محتوى">Content</option><option data-ar="تصميم وهوية">Design and branding</option><option data-ar="شراء إعلانات">Media buying</option><option data-ar="لسه مش متأكد">Not sure yet</option></select></label>
<label><span data-ar="رسالتك">Message</span><textarea name="m" rows="5" required></textarea></label>
<button class="btn" type="submit" data-ar="أرسل عبر واتساب">Send on WhatsApp</button>
</form>
<div class="card g"><h3 data-ar="مباشرة">Direct</h3>
<p><a data-wa dir="ltr" href="#"></a></p>
<p><a data-mail href="#"></a></p></div>
</div></section>
</main><script src="seed.js"></script><script src="app.js"></script>
<script>
$('f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),s=e.target.s.selectedOptions[0].textContent;
const m=t('Hi Hook, I am '+d.get('n')+' from '+(d.get('b')||'my brand')+'.\nNeed: '+s+'\n'+d.get('m'),'أهلاً هوك، أنا '+d.get('n')+' من '+(d.get('b')||'براند خاص بيا')+'.\nمحتاج: '+s+'\n'+d.get('m'));
open('https://wa.me/'+DB.contact.whatsapp+'?text='+encodeURIComponent(m),'_blank')};
</script></body></html>
