<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account | Hook</title>
<link rel="stylesheet" href="style.css"></head><body>
<main>
<section class="phero"><div class="wrap"><span class="script" data-ar="حسابك">Your account</span><h1 data-ar="الدخول">Sign in</h1></div></section>
<section style="padding-top:20px"><div class="wrap" id="box"></div></section>
</main><script src="seed.js"></script><script src="app.js"></script>
<script>
let mode='login';
function draw(){
  const b=$('box');
  if(ME){b.innerHTML='<div class="card" style="max-width:560px"><h3>'+esc(ME.username)+'</h3><p>'+esc(ME.email)+'</p><div class="btns" style="margin-top:18px">'+(ME.role==='admin'?'<a class="btn" href="dashboard.html">'+t('Dashboard','لوحة التحكم')+'</a>':'')+'<button class="btn" id="out">'+t('Logout','تسجيل الخروج')+'</button></div></div>';
    $('out').onclick=async()=>{await post('/api/logout',{});location.reload()};return}
  const reg=mode==='register';
  b.innerHTML='<form class="card" id="af"><div class="tabs"><button type="button" data-m="login" aria-pressed="'+!reg+'">'+t('Sign in','دخول')+'</button><button type="button" data-m="register" aria-pressed="'+reg+'">'+t('Create account','حساب جديد')+'</button></div>'
   +(reg?'<label><span>'+t('Username','اسم المستخدم')+'</span><input name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+"></label><label><span>'+t('Email','الإيميل')+'</span><input name="email" type="email" autocomplete="email" required></label>'
        :'<label><span>'+t('Username or email','اسم المستخدم أو الإيميل')+'</span><input name="id" autocomplete="username" required></label>')
   +'<label><span>'+t('Password','كلمة المرور')+'</span><input name="password" type="password" autocomplete="'+(reg?'new-password':'current-password')+'" required minlength="'+(reg?8:1)+'"></label>'
   +'<button class="btn" type="submit">'+(reg?t('Create account','إنشاء الحساب'):t('Sign in','دخول'))+'</button><p class="msg err" id="err"></p></form>';
  b.querySelector('.tabs').onclick=e=>{const x=e.target.closest('button');if(x){mode=x.dataset.m;draw()}};
  $('af').onsubmit=async e=>{
    e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    let r;try{r=await post(reg?'/api/register':'/api/login',d)}catch(x){$('err').textContent=t('The server is not running. Accounts need the Node server.','السيرفر مش شغال. الحسابات محتاجة سيرفر Node.');return}
    const j=await r.json().catch(()=>({}));
    if(r.ok)location.href=j.user.role==='admin'?'dashboard.html':'index.html';else $('err').textContent=j.error||'Error';
  };
}
document.addEventListener('auth',draw);document.addEventListener('langchange',()=>{if(DB&&document.readyState)draw()});
</script></body></html>
