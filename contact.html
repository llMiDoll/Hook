<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Hook</title>
<link rel="stylesheet" href="style.css"></head><body><main><section class="hero"><div class="wrap"><h1 data-k="ct_h"></h1><p data-k="ct_p"></p></div></section>
<section><div class="wrap split">
<form id="f"><label><span data-k="f_n"></span><input name="n" required></label><label><span data-k="f_b"></span><input name="b"></label>
<label><span data-k="f_s"></span><select name="s" id="sel"></select></label><label><span data-k="f_m"></span><textarea name="m" rows="5" required></textarea></label>
<button class="btn" type="submit" data-k="f_send"></button></form>
<div class="card y"><h3 data-t="direct"></h3><p id="dc"></p></div></div></section></main><script src="app.js"></script>
<script>
onL(()=>{const s=site(),v=$('sel').value;$('sel').innerHTML=['o1','o2','o3','o4','o5'].map(k=>'<option value="'+U[k][0]+'">'+t(k)+'</option>').join('');if(v)$('sel').value=v;
$('dc').innerHTML='<a href="https://wa.me/'+s.wa+'">'+s.phone+'</a><br><a href="mailto:'+s.email+'">'+s.email+'</a>'});
$('f').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);open('https://wa.me/'+site().wa+'?text='+encodeURIComponent("Hi Hook, I'm "+d.get('n')+" from "+(d.get('b')||'my brand')+".\nNeed: "+d.get('s')+"\n"+d.get('m')),'_blank')};
</script></body></html>
